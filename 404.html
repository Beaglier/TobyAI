  .menu-toggle { display: none; width: 40px; height: 40px; border: 0; background: none; padding: 8px; cursor: pointer;

<script>
(function(){var h=document.querySelector('.site-head'),b=h&&h.querySelector('.menu-toggle');if(!b)return;
